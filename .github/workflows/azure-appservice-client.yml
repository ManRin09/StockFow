name: Build and Deploy Client to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'Client/**'
      - '.github/workflows/azure-appservice-client.yml'
  workflow_dispatch:

env:
  # Cambia 'stockflow-client' por el nombre exacto de tu Azure Web App (o defínelo como Secret/Variable en GitHub)
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'stockflow-client' }}
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'Client/package-lock.json'

      - name: Instalar dependencias y compilar Vite
        working-directory: ./Client
        run: |
          npm ci
          npm run build

      - name: Subir artefacto compilado (dist)
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: Client/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: client-dist

      - name: Desplegar en Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
